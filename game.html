<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#5cc3ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Super Evi World 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#5cc3ff;
    font-family:'Fredoka',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;}
  #game{display:block;width:100vw;height:100vh;}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);
    z-index:5;pointer-events:none;background:rgba(0,0,0,0.35);color:#fff;font-weight:600;
    padding:8px 18px;border-radius:999px;font-size:clamp(0.9rem,4vw,1.15rem);white-space:nowrap;
    opacity:0;transition:opacity .3s;backdrop-filter:blur(4px);}
  #hint.show{opacity:1;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint"></div>
<script>
(function(){
"use strict";
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const hintEl=document.getElementById('hint');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(current&&current.layout)current.layout();
}
window.addEventListener('resize',()=>{resize();});

// ---------- math helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- audio ----------
let actx=null,muted=false,noiseBuf=null;
function ensureAudio(){
  if(actx)return;
  try{actx=new(window.AudioContext||window.webkitAudioContext)();
    const n=actx.sampleRate*0.4;noiseBuf=actx.createBuffer(1,n,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){}
}
function tone(freq,dur,type,vol,when){
  if(muted||!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.07;
    o.connect(g);g.connect(actx.destination);const t=actx.currentTime+(when||0);
    g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.15));
    o.start(t);o.stop(t+(dur||0.15));}catch(e){}
}
function noise(dur,vol,freq){
  if(muted||!actx||!noiseBuf)return;
  try{const s=actx.createBufferSource();s.buffer=noiseBuf;
    const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;f.Q.value=0.8;
    const g=actx.createGain();g.gain.value=vol||0.05;
    s.connect(f);f.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.start(t);s.stop(t+dur);}catch(e){}
}
const SFX={
  tap:()=>{tone(660,0.09,'triangle',0.07);tone(990,0.08,'sine',0.04,0.02);},
  drip:()=>{noise(0.12,0.045,900+Math.random()*400);},
  bloom:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,0.18,'triangle',0.06,i*0.06));},
  page:()=>{noise(0.18,0.05,500);},
  pop:()=>{tone(880,0.07,'square',0.06);tone(1320,0.1,'sine',0.05,0.05);},
  win:()=>{[523,659,784,1046,1319].forEach((f,i)=>tone(f,0.2,'triangle',0.07,i*0.08));},
  back:()=>{tone(440,0.08,'sine',0.05);},
};

// ---------- pointer ----------
const P={x:0,y:0,down:false,downX:0,downY:0,moved:false};
function pt(e){const t=e.touches?e.touches[0]:e;return t?{x:t.clientX,y:t.clientY}:null;}
function onDown(e){const p=pt(e);if(!p)return;ensureAudio();P.x=p.x;P.y=p.y;P.down=true;P.downX=p.x;P.downY=p.y;P.moved=false;if(current.onDown)current.onDown(p.x,p.y);}
function onMove(e){const p=pt(e);if(!p)return;if(Math.abs(p.x-P.downX)>6||Math.abs(p.y-P.downY)>6)P.moved=true;P.x=p.x;P.y=p.y;if(current.onMove)current.onMove(p.x,p.y);}
function onUp(e){const wasTap=!P.moved;P.down=false;if(current.onUp)current.onUp(P.x,P.y,wasTap);}
canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onUp(e);},{passive:false});

// ---------- hint bubble ----------
let hintTimer=null;
function hint(txt,ms){hintEl.textContent=txt;hintEl.classList.add('show');clearTimeout(hintTimer);if(ms)hintTimer=setTimeout(()=>hintEl.classList.remove('show'),ms);}
function hideHint(){hintEl.classList.remove('show');}

// ---------- shared drawing ----------
function skyDay(top,bot){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top||'#3aa8ff');g.addColorStop(1,bot||'#bfefff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function sun(x,y,r){const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,2,x,y,r*1.6);g.addColorStop(0,'#fff6c9');g.addColorStop(0.5,'#ffe267');g.addColorStop(1,'rgba(255,226,103,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.6,0,7);ctx.fill();ctx.fillStyle='#ffe267';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#fff';ctx.strokeStyle='rgba(120,180,230,0.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.arc(30,-12,32,0,7);ctx.arc(64,0,26,0,7);ctx.arc(32,14,30,0,7);ctx.fill();ctx.restore();}
function softShadow(x,y,w,h){ctx.fillStyle='rgba(0,0,0,0.13)';ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,7);ctx.fill();}

// the Luni character (moon-ball mascot) — drawn, not emoji
function drawLuni(x,y,r,opts){
  opts=opts||{};
  ctx.save();ctx.translate(x,y);if(opts.rot)ctx.rotate(opts.rot);
  softShadow(0,r*0.95,r*0.8,r*0.22);
  const g=ctx.createRadialGradient(-r*0.32,-r*0.36,r*0.15,0,0,r);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.55,'#eef2ff');g.addColorStop(1,'#b9c6ef');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.09);ctx.strokeStyle='#46507e';ctx.stroke();
  ctx.fillStyle='rgba(150,162,205,0.5)';
  ctx.beginPath();ctx.arc(-r*0.34,r*0.28,r*0.16,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.36,-r*0.12,r*0.1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.12,r*0.42,r*0.07,0,7);ctx.fill();
  // face
  ctx.fillStyle='#3a3550';
  ctx.beginPath();ctx.arc(-r*0.26,-r*0.06,r*0.1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.26,-r*0.06,r*0.1,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.29,-r*0.1,r*0.035,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.23,-r*0.1,r*0.035,0,7);ctx.fill();
  // rosy cheeks
  ctx.fillStyle='rgba(255,140,170,0.5)';ctx.beginPath();ctx.arc(-r*0.42,r*0.16,r*0.1,0,7);ctx.fill();ctx.beginPath();ctx.arc(r*0.42,r*0.16,r*0.1,0,7);ctx.fill();
  // smile
  ctx.strokeStyle='#3a3550';ctx.lineWidth=Math.max(2,r*0.06);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,r*0.12,r*0.26,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.restore();
}

// a drawn flower that grows with g (0..1). type defines look.
function drawFlower(baseX,baseY,g,type,sway){
  const grow=easeOut(clamp(g,0,1));
  if(grow<=0.001){ // seed mound
    ctx.fillStyle='#7a4a22';ctx.beginPath();ctx.ellipse(baseX,baseY,16,7,0,0,7);ctx.fill();return;
  }
  const h=type.height*grow;
  const lean=Math.sin((sway||0))*6*grow;
  const topX=baseX+lean, topY=baseY-h;
  // stem
  const sg=ctx.createLinearGradient(baseX,baseY,topX,topY);
  sg.addColorStop(0,'#2f8a2a');sg.addColorStop(1,'#62cc52');
  ctx.strokeStyle=sg;ctx.lineWidth=Math.max(3,7*grow);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(baseX,baseY);
  ctx.quadraticCurveTo(baseX+lean*0.5-6,baseY-h*0.5,topX,topY);ctx.stroke();
  // leaves
  function leaf(t,dir){
    const ls=clamp((grow-t)/0.22,0,1);if(ls<=0)return;
    const ly=baseY-h*t, lx=baseX+lean*t;
    ctx.save();ctx.translate(lx,ly);ctx.rotate(dir*0.7);ctx.scale(ls,ls);
    const lg=ctx.createLinearGradient(0,0,dir*34,0);lg.addColorStop(0,'#4fb83f');lg.addColorStop(1,'#7ee06a');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(dir*20,-14,dir*40,0);ctx.quadraticCurveTo(dir*20,10,0,0);ctx.fill();
    ctx.strokeStyle='rgba(40,120,40,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(dir*36,0);ctx.stroke();
    ctx.restore();
  }
  leaf(0.34,-1);leaf(0.52,1);
  // flower head
  const bloom=clamp((grow-0.6)/0.4,0,1);
  if(bloom>0){
    ctx.save();ctx.translate(topX,topY);
    const b=easeOut(bloom);
    if(type.kind==='daisy'||type.kind==='sun'){
      const n=type.petals,pl=type.petalLen*b,pw=type.petalW*b;
      for(let i=0;i<n;i++){
        ctx.save();ctx.rotate((i/n)*Math.PI*2+grow*0.4);
        const pg=ctx.createLinearGradient(0,0,0,-pl);pg.addColorStop(0,type.c1);pg.addColorStop(1,type.c2);
        ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(0,-pl*0.55,pw,pl*0.55,0,0,7);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1.5;ctx.stroke();
        ctx.restore();
      }
      const cr=type.center*b;
      const cg=ctx.createRadialGradient(-cr*0.3,-cr*0.3,1,0,0,cr);cg.addColorStop(0,type.cc1);cg.addColorStop(1,type.cc2);
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,cr,0,7);ctx.fill();
    } else { // tulip cup
      const pl=type.petalLen*b;
      ctx.fillStyle=type.c2;ctx.beginPath();ctx.moveTo(-pl*0.5,0);ctx.quadraticCurveTo(-pl*0.6,-pl,0,-pl);ctx.quadraticCurveTo(pl*0.6,-pl,pl*0.5,0);ctx.quadraticCurveTo(0,-pl*0.3,-pl*0.5,0);ctx.fill();
      ctx.fillStyle=type.c1;ctx.beginPath();ctx.moveTo(-pl*0.34,-pl*0.1);ctx.quadraticCurveTo(0,-pl*1.05,pl*0.34,-pl*0.1);ctx.quadraticCurveTo(0,-pl*0.45,-pl*0.34,-pl*0.1);ctx.fill();
    }
    ctx.restore();
  }
}

const FLOWERS=[
  {kind:'sun',height:150,petals:14,petalLen:42,petalW:9,center:20,c1:'#ffd23f',c2:'#ff9e2c',cc1:'#9a5a22',cc2:'#5e3413'},
  {kind:'daisy',height:128,petals:12,petalLen:34,petalW:8,center:14,c1:'#ffffff',c2:'#ffe9f4',cc1:'#ffe06a',cc2:'#f5a623'},
  {kind:'tulip',height:138,petals:1,petalLen:46,petalW:0,center:0,c1:'#ff7eb6',c2:'#e84393'},
];

// ---------- scene manager ----------
let current=null, fade={a:0,dir:0,to:null};
function setScene(name){fade.dir=1;fade.to=name;SFX.tap();}
function doSwitch(name){
  hideHint();
  if(name==='menu')current=Menu;
  else if(name==='garden')current=Garden;
  else if(name==='story')current=Story;
  else if(name==='moon')current=Moon;
  if(current.enter)current.enter();
  if(current.layout)current.layout();
}
const progress={garden:false,story:false,moon:false};
function allDone(){return progress.garden&&progress.story&&progress.moon;}

// back button (shared)
function drawBackBtn(){const x=30,y=Math.max(34,28)+ (window.__safeTop||0),r=22;
  ctx.fillStyle='rgba(255,255,255,0.92)';ctx.strokeStyle='#2b2b3a';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#2b2b3a';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+5,y-8);ctx.lineTo(x-7,y);ctx.lineTo(x+5,y+8);ctx.stroke();
  return {x,y,r:r+10};
}

/* =======================================================================
   MENU — world hub with three drawn cards
   ======================================================================= */
const Menu={
  t:0,cards:[],clouds:[],balloons:[],confetti:[],
  layout(){
    const cy=H*0.52, cw=Math.min(W*0.82,360), ch=Math.min(H*0.16,118), gap=ch*0.28;
    this.cards=[
      {key:'garden',title:'Grow a Garden',sub:'Water & watch it bloom',c:'#7ed957',c2:'#3fa83f'},
      {key:'story', title:'Story Time',    sub:"Read Evi's tale",       c:'#ffc34d',c2:'#f08a24'},
      {key:'moon',  title:'Moon Ball',     sub:'Swing & pop the lights',c:'#9aa6ff',c2:'#5a64c8'},
    ].map((c,i)=>({...c,x:W/2-cw/2,y:cy+i*(ch+gap)-(ch+gap),w:cw,h:ch}));
  },
  enter(){
    this.clouds=[];for(let i=0;i<4;i++)this.clouds.push({x:rand(0,W),y:rand(40,H*0.32),s:rand(0.5,1.1),sp:rand(5,11)});
    hint('Tap a world to play! 🌟',3000);
  },
  update(dt){this.t+=dt;for(const c of this.clouds){c.x-=c.sp*dt;if(c.x<-120)c.x=W+90;}
    if(allDone()){this.confetti=this.confetti||[];if(this.confetti.length<140&&Math.random()<0.5){const cols=['#ff5b7a','#ffd23f','#54b8ff','#5ed24f','#ff7ab8'];this.confetti.push({x:rand(0,W),y:-10,vx:rand(-30,30),vy:rand(60,150),rot:rand(0,7),vr:rand(-5,5),c:cols[(Math.random()*cols.length)|0],w:rand(6,12)});}
      for(const p of this.confetti){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}this.confetti=this.confetti.filter(p=>p.y<H+20);}
  },
  draw(){
    skyDay('#36a6ff','#bdeeff');
    sun(W-58,64,40);
    for(const c of this.clouds)cloud(c.x,c.y,c.s);
    // rolling hills
    function hill(by,col,amp,wl,off){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=14)ctx.lineTo(x,by+Math.sin((x+off)/wl)*amp);ctx.lineTo(W,H);ctx.closePath();ctx.fill();}
    hill(H*0.74,'#8fd86a',24,150,30);hill(H*0.82,'#69c247',20,110,200);
    // title
    ctx.textAlign='center';
    ctx.font=`${Math.min(W*0.115,52)}px 'Luckiest Guy',cursive`;
    ctx.lineWidth=7;ctx.strokeStyle='#b23a00';ctx.fillStyle='#ffd23f';
    const bob=Math.sin(this.t*2)*4;
    ctx.strokeText('Super Evi World',W/2,H*0.16+bob);ctx.fillText('Super Evi World',W/2,H*0.16+bob);
    ctx.font=`600 ${Math.min(W*0.05,22)}px 'Fredoka',sans-serif`;
    ctx.fillStyle='#16486f';ctx.fillText(allDone()?'🎂 Happy 7th Birthday, Evi! 🎂':'Happy 7th Birthday, Evi!',W/2,H*0.16+bob+34);
    // cards
    for(const c of this.cards){
      const done=progress[c.key];
      softShadow(c.x+c.w/2,c.y+c.h+6,c.w*0.42,12);
      const g=ctx.createLinearGradient(0,c.y,0,c.y+c.h);g.addColorStop(0,c.c);g.addColorStop(1,c.c2);
      ctx.fillStyle=g;ctx.strokeStyle='#2b2b3a';ctx.lineWidth=4;rr(c.x,c.y,c.w,c.h,22);ctx.fill();ctx.stroke();
      // icon area
      const ix=c.x+c.h*0.55, iy=c.y+c.h/2, ir=c.h*0.32;
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(ix,iy,ir,0,7);ctx.fill();
      this.icon(c.key,ix,iy,ir);
      // text
      ctx.textAlign='left';ctx.fillStyle='#fff';
      ctx.font=`700 ${Math.min(c.h*0.26,26)}px 'Fredoka',sans-serif`;
      ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=4;ctx.lineJoin='round';
      ctx.strokeText(c.title,c.x+c.h*1.05,c.y+c.h*0.42);ctx.fillText(c.title,c.x+c.h*1.05,c.y+c.h*0.42);
      ctx.font=`500 ${Math.min(c.h*0.17,16)}px 'Fredoka',sans-serif`;ctx.lineWidth=3;
      ctx.strokeText(c.sub,c.x+c.h*1.05,c.y+c.h*0.68);ctx.fillText(c.sub,c.x+c.h*1.05,c.y+c.h*0.68);
      // done star
      if(done){ctx.font=`${c.h*0.3}px serif`;ctx.textAlign='center';ctx.fillText('⭐',c.x+c.w-c.h*0.34,c.y+c.h*0.62);}
      ctx.textAlign='left';
    }
    if(this.confetti)for(const p of this.confetti){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);ctx.restore();}
  },
  icon(key,x,y,r){
    if(key==='garden'){drawFlower(x,y+r*0.8,1,FLOWERS[0],0);}
    else if(key==='story'){ // open book
      ctx.save();ctx.translate(x,y);
      ctx.fillStyle='#fff';ctx.strokeStyle='#c97b2c';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(0,-r*0.5);ctx.quadraticCurveTo(-r*0.9,-r*0.7,-r*0.95,-r*0.2);ctx.lineTo(-r*0.95,r*0.55);ctx.quadraticCurveTo(-r*0.9,r*0.2,0,r*0.4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-r*0.5);ctx.quadraticCurveTo(r*0.9,-r*0.7,r*0.95,-r*0.2);ctx.lineTo(r*0.95,r*0.55);ctx.quadraticCurveTo(r*0.9,r*0.2,0,r*0.4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle='rgba(120,90,40,0.4)';ctx.lineWidth=1.5;
      for(let i=-2;i<=2;i++){if(i===0)continue;ctx.beginPath();ctx.moveTo(i<0?-r*0.15:r*0.15,-r*0.2+(i+2)*r*0.13);ctx.lineTo(i<0?-r*0.8:r*0.8,-r*0.2+(i+2)*r*0.13);ctx.stroke();}
      ctx.restore();
    } else { drawLuni(x,y,r*0.78); }
  },
  onUp(x,y,tap){
    if(!tap)return;
    for(const c of this.cards){if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h){setScene(c.key);return;}}
  }
};

/* =======================================================================
   GARDEN — water the plants and watch them grow
   ======================================================================= */
const Garden={
  plants:[],can:{x:0,y:0,pouring:false},drops:[],butterflies:[],t:0,doneT:0,back:null,sun:0,
  layout(){
    const n=3, gy=H*0.78, m=W*0.16, span=(W-2*m);
    this.plants=this.plants.length===n?this.plants.map((p,i)=>({...p,x:m+span*(i/(n-1)),baseY:gy})):
      Array.from({length:n},(_,i)=>({x:m+span*(i/(n-1)),baseY:gy,g:0,type:FLOWERS[i],sway:rand(0,7),bloomed:false}));
  },
  enter(){this.drops=[];this.butterflies=[];this.t=0;this.doneT=0;this.can.x=W/2;this.can.y=H*0.4;this.can.pouring=false;hint('Hold over a plant to water it! 💧',3500);},
  pourTarget(){ // which plant is the spout above
    const sx=this.spout().x;
    let best=null,bd=1e9;
    for(const p of this.plants){const d=Math.abs(p.x-sx);if(d<70&&d<bd&&this.spout().y<p.baseY-10){bd=d;best=p;}}
    return best;
  },
  spout(){return {x:this.can.x-34,y:this.can.y+6};},
  update(dt){
    this.t+=dt;this.sun+=dt;
    for(const p of this.plants)p.sway+=dt*1.5;
    if(this.can.pouring){
      const tgt=this.pourTarget();
      if(Math.random()<0.6){const s=this.spout();this.drops.push({x:s.x+rand(-4,4),y:s.y,vy:rand(120,180),vx:rand(-10,10),tgt});}
      if(Math.random()<0.25)SFX.drip();
      if(tgt&&!tgt.bloomed){
        tgt.g=clamp(tgt.g+dt*0.32,0,1);
        if(tgt.g>=1&&!tgt.bloomed){tgt.bloomed=true;SFX.bloom();
          for(let i=0;i<3;i++)this.butterflies.push({x:tgt.x+rand(-20,20),y:tgt.baseY-tgt.type.height,t:rand(0,7),r:rand(120,160)});
        }
      }
    }
    for(const d of this.drops){d.y+=d.vy*dt;d.x+=d.vx*dt;d.vy+=400*dt;}
    this.drops=this.drops.filter(d=>d.y<H*0.82);
    for(const b of this.butterflies){b.t+=dt*2;b.x+=Math.cos(b.t)*30*dt;b.y+=Math.sin(b.t*1.3)*20*dt;}
    if(this.plants.every(p=>p.bloomed)){this.doneT+=dt;if(this.doneT>0.4&&!progress.garden){progress.garden=true;hint('Your garden bloomed! 🌸 Tap ◀ to go back',5000);}}
  },
  draw(){
    skyDay('#5cb8ff','#cdeeff');
    sun(W*0.16,H*0.16,38+Math.sin(this.sun)*2);
    cloud(W*0.7,H*0.13,0.9);cloud(W*0.4,H*0.24,0.6);
    // ground with perspective rows
    const gy=H*0.66;
    const gg=ctx.createLinearGradient(0,gy,0,H);gg.addColorStop(0,'#8ad06a');gg.addColorStop(0.18,'#69b840');gg.addColorStop(0.19,'#7a4a22');gg.addColorStop(1,'#5c3517');
    ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
    // soil mounds + plants
    for(const p of this.plants){
      softShadow(p.x,p.baseY+6,30,9);
      ctx.fillStyle='#5c3517';ctx.beginPath();ctx.ellipse(p.x,p.baseY,30,12,0,0,7);ctx.fill();
      ctx.fillStyle='#714322';ctx.beginPath();ctx.ellipse(p.x,p.baseY-2,24,8,0,0,7);ctx.fill();
      drawFlower(p.x,p.baseY,p.g,p.type,p.sway);
    }
    // water drops
    ctx.fillStyle='#7fd3ff';for(const d of this.drops){ctx.beginPath();ctx.ellipse(d.x,d.y,3,5,0,0,7);ctx.fill();}
    // butterflies (drawn)
    for(const b of this.butterflies)this.butterfly(b.x,b.y,b.t);
    // watering can
    this.drawCan();
    this.back=drawBackBtn();
  },
  butterfly(x,y,t){const f=Math.sin(t*6)*0.6+0.7;ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#ff7eb6';ctx.save();ctx.scale(f,1);ctx.beginPath();ctx.ellipse(-7,0,7,10,0,0,7);ctx.ellipse(-7,8,5,6,0,0,7);ctx.fill();ctx.restore();
    ctx.save();ctx.scale(f,1);ctx.beginPath();ctx.ellipse(7,0,7,10,0,0,7);ctx.ellipse(7,8,5,6,0,0,7);ctx.fill();ctx.restore();
    ctx.fillStyle='#3a3550';ctx.beginPath();ctx.ellipse(0,2,2.2,9,0,0,7);ctx.fill();ctx.restore();},
  drawCan(){
    const x=this.can.x,y=this.can.y,tilt=this.can.pouring?-0.5:0;
    ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
    softShadow(0,42,26,8);
    const g=ctx.createLinearGradient(-26,-22,26,22);g.addColorStop(0,'#7ad0ff');g.addColorStop(1,'#2b86e0');
    ctx.fillStyle=g;ctx.strokeStyle='#1a5aa0';ctx.lineWidth=3;
    rr(-26,-22,52,46,12);ctx.fill();ctx.stroke();
    // spout
    ctx.beginPath();ctx.moveTo(-22,-6);ctx.lineTo(-46,-2);ctx.lineTo(-44,12);ctx.lineTo(-20,12);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.stroke();
    // handle
    ctx.beginPath();ctx.arc(6,-22,18,Math.PI*1.1,Math.PI*1.95);ctx.lineWidth=5;ctx.strokeStyle='#1a5aa0';ctx.stroke();
    // highlight
    ctx.fillStyle='rgba(255,255,255,0.4)';rr(-20,-16,12,26,6);ctx.fill();
    ctx.restore();
  },
  onDown(x,y){if(this.back&&dist2(x,y,this.back.x,this.back.y)<this.back.r*this.back.r){SFX.back();setScene('menu');return;}this.can.x=x;this.can.y=y;this.can.pouring=true;},
  onMove(x,y){if(P.down){this.can.x=x;this.can.y=clamp(y,H*0.2,H*0.6);}},
  onUp(){this.can.pouring=false;}
};

/* =======================================================================
   STORY — swipeable personalized picture book
   ======================================================================= */
const Story={
  page:0,turn:0,dir:1,t:0,back:null,
  pages:[
    {title:"Evi's Big Day",text:"Once upon a birthday bright,\na girl named Evi shone like light!",art:'cover'},
    {title:"She Loves to Read",text:"With every book she'd dive inside,\nto worlds so wide, she'd be the guide.",art:'read'},
    {title:"She Grows Green Things",text:"She waters seeds and watches them grow,\ninto tall flowers, row by row.",art:'grow'},
    {title:"She Makes Art",text:"With paint and glue and bits of string,\nshe'd craft and color everything!",art:'art'},
    {title:"She Shares & Giggles",text:"She shares her snacks, she shares her toys,\nand fills the room with giggly joys!",art:'share'},
    {title:"Happy 7th, Evi!",text:"She swings her moon ball, round and round —\nthe happiest girl that can be found! 🌙",art:'moon'},
  ],
  enter(){this.page=0;this.turn=0;this.t=0;hint('Swipe or tap ▶ to turn the page 📖',3500);},
  layout(){},
  next(d){const np=this.page+d;if(np<0||np>=this.pages.length)return;this.dir=d;this.turn=0.001;SFX.page();
    this._target=np;},
  update(dt){this.t+=dt;
    if(this.turn>0){this.turn=Math.min(1,this.turn+dt*2.6);if(this.turn>=1){this.page=this._target;this.turn=0;
      if(this.page===this.pages.length-1&&!progress.story){progress.story=true;hint('The End! ⭐ Tap ◀ to go back',4000);}}}
  },
  draw(){
    // cozy reading background
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe7b8');g.addColorStop(1,'#ffc98a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<3;i++){ctx.fillStyle='rgba(255,255,255,0.25)';cloud(W*(0.2+i*0.3),H*(0.1+i*0.05),0.7);}
    const bx=W*0.08,by=H*0.16,bw=W*0.84,bh=H*0.64;
    softShadow(bx+bw/2,by+bh+10,bw*0.46,16);
    // book cover/back
    ctx.fillStyle='#c0581f';rr(bx-8,by-8,bw+16,bh+16,18);ctx.fill();
    // current page
    this.drawPage(this.pages[this.turn>0?this.page:this.page],bx,by,bw,bh,1);
    // turning page on top
    if(this.turn>0){
      const t=easeInOut(this.turn);
      ctx.save();
      // simple slide+fold
      const w=bw*(1-t)*(this.dir>0?1:1);
      ctx.globalAlpha=1;
      const px=this.dir>0?bx+bw-(bw*(1-t)):bx;
      ctx.save();ctx.beginPath();rr(bx,by,bw,bh,14);ctx.clip();
      this.drawPage(this.pages[this._target],bx+(this.dir>0?bw*(1-t):-bw*(1-t)),by,bw,bh,1);
      ctx.restore();
      ctx.restore();
    }
    // page arrows
    this.arrows(bx,by,bw,bh);
    this.back=drawBackBtn();
  },
  drawPage(pg,x,y,w,h,a){
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle='#fffdf5';ctx.strokeStyle='#e0c9a0';ctx.lineWidth=2;rr(x,y,w,h,14);ctx.fill();ctx.stroke();
    // illustration area
    const ax=x+w/2, ay=y+h*0.32, ar=Math.min(w,h)*0.22;
    ctx.fillStyle='#eaf6ff';rr(x+14,y+14,w-28,h*0.46,12);ctx.fill();
    ctx.save();ctx.beginPath();rr(x+14,y+14,w-28,h*0.46,12);ctx.clip();
    this.illus(pg.art,ax,ay,ar);
    ctx.restore();
    // title
    ctx.textAlign='center';ctx.fillStyle='#c0581f';
    ctx.font=`${Math.min(w*0.085,30)}px 'Luckiest Guy',cursive`;
    ctx.fillText(pg.title,x+w/2,y+h*0.66);
    // body text
    ctx.fillStyle='#4a3a2a';ctx.font=`600 ${Math.min(w*0.058,22)}px 'Fredoka',sans-serif`;
    const lines=pg.text.split('\n');lines.forEach((ln,i)=>ctx.fillText(ln,x+w/2,y+h*0.76+i*Math.min(w*0.078,30)));
    // page number
    ctx.fillStyle='#bda';ctx.font=`500 14px 'Fredoka'`;ctx.fillStyle='#c9b58f';
    ctx.fillText((this.pages.indexOf(pg)+1)+' / '+this.pages.length,x+w/2,y+h-16);
    ctx.restore();
  },
  illus(kind,x,y,r){
    if(kind==='cover'){skyMini(x,y,r);drawLuni(x,y,r*0.7);this.balloon(x+r*0.9,y-r*0.4,'#ff5b7a','7');}
    else if(kind==='read'){drawLuni(x-r*0.2,y,r*0.6);
      ctx.fillStyle='#fff';ctx.strokeStyle='#54b8ff';ctx.lineWidth=3;
      ctx.save();ctx.translate(x+r*0.5,y+r*0.1);
      ctx.beginPath();ctx.moveTo(0,-r*0.4);ctx.quadraticCurveTo(-r*0.5,-r*0.5,-r*0.55,r*0.4);ctx.lineTo(0,r*0.3);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-r*0.4);ctx.quadraticCurveTo(r*0.5,-r*0.5,r*0.55,r*0.4);ctx.lineTo(0,r*0.3);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();
      this.sparkle(x+r*0.7,y-r*0.6,this.t);
    }
    else if(kind==='grow'){drawLuni(x-r*0.5,y-r*0.2,r*0.5);drawFlower(x+r*0.4,y+r*0.7,1,FLOWERS[0],this.t);
      ctx.fillStyle='#7fd3ff';for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(x+r*0.1+i*5,y+(i*8)%20,3,5,0,0,7);ctx.fill();}}
    else if(kind==='art'){drawLuni(x,y-r*0.1,r*0.6);
      const cols=['#ff5b7a','#ffd23f','#54b8ff','#5ed24f'];for(let i=0;i<4;i++){ctx.fillStyle=cols[i];ctx.beginPath();ctx.arc(x-r*0.8+i*r*0.5,y+r*0.7+Math.sin(this.t+i)*4,r*0.16,0,7);ctx.fill();}
      ctx.strokeStyle='#a05a2c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+r*0.7,y-r*0.7);ctx.lineTo(x+r*0.4,y+r*0.1);ctx.stroke();ctx.fillStyle='#ff5b7a';ctx.beginPath();ctx.arc(x+r*0.4,y+r*0.15,7,0,7);ctx.fill();}
    else if(kind==='share'){drawLuni(x-r*0.55,y,r*0.5);drawLuni(x+r*0.55,y,r*0.5);
      ctx.fillStyle='#ff5b7a';const hx=x,hy=y-r*0.1,s=r*0.22+Math.sin(this.t*3)*2;
      ctx.beginPath();ctx.moveTo(hx,hy+s);ctx.bezierCurveTo(hx-s*1.4,hy-s*0.4,hx-s*0.5,hy-s*1.2,hx,hy-s*0.4);ctx.bezierCurveTo(hx+s*0.5,hy-s*1.2,hx+s*1.4,hy-s*0.4,hx,hy+s);ctx.fill();}
    else if(kind==='moon'){ // night
      ctx.fillStyle='#2a2456';ctx.fillRect(x-r*2.5,y-r*1.5,r*5,r*3);
      for(let i=0;i<10;i++){ctx.fillStyle='#fff';ctx.globalAlpha=0.5+Math.sin(this.t*2+i)*0.4;ctx.beginPath();ctx.arc(x-r*2+i*r*0.45,y-r*1.1+(i%3)*r*0.4,1.6,0,7);ctx.fill();}
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-r*1.5);ctx.lineTo(x+Math.sin(this.t)*r*0.4,y);ctx.stroke();
      drawLuni(x+Math.sin(this.t)*r*0.4,y,r*0.55);}
  },
  balloon(x,y,c,txt){ctx.strokeStyle='#aaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x,y+44);ctx.stroke();
    ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,15,19,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`${16}px 'Luckiest Guy'`;ctx.textAlign='center';ctx.fillText(txt,x,y+5);},
  sparkle(x,y,t){ctx.save();ctx.translate(x,y);ctx.rotate(t);ctx.fillStyle='#ffd23f';for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(2,-6);ctx.lineTo(0,-12);ctx.lineTo(-2,-6);ctx.fill();}ctx.restore();},
  arrows(x,y,w,h){const cy=y+h+0;const ay=H-Math.max(46,H*0.07);
    // left
    if(this.page>0){this.arrowBtn(x+30,ay,-1);}
    if(this.page<this.pages.length-1){this.arrowBtn(x+w-30,ay,1);}
  },
  arrowBtn(x,y,d){ctx.fillStyle='#c0581f';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-d*5,y-8);ctx.lineTo(x+d*7,y);ctx.lineTo(x-d*5,y+8);ctx.stroke();
    this['_arr'+(d<0?'L':'R')]={x,y,r:30};},
  onUp(x,y,tap){
    if(this.back&&dist2(x,y,this.back.x,this.back.y)<this.back.r*this.back.r){SFX.back();setScene('menu');return;}
    if(this._arrL&&dist2(x,y,this._arrL.x,this._arrL.y)<this._arrL.r*this._arrL.r){this.next(-1);return;}
    if(this._arrR&&dist2(x,y,this._arrR.x,this._arrR.y)<this._arrR.r*this._arrR.r){this.next(1);return;}
    if(tap){ if(x>W/2)this.next(1); else this.next(-1); return;}
    // swipe
    const dx=x-P.downX;if(dx<-40)this.next(1);else if(dx>40)this.next(-1);
  }
};
function skyMini(x,y,r){ctx.fillStyle='#bfe9ff';ctx.fillRect(x-r*2.5,y-r*1.5,r*5,r*3);}

/* =======================================================================
   MOON — pendulum physics: fling the moon ball to pop fireflies
   ======================================================================= */
const Moon={
  pivot:{x:0,y:0},L:0,ang:0.6,vel:0,drag:false,prevAng:0,trail:[],orbs:[],t:0,back:null,popped:0,
  layout(){this.pivot={x:W/2,y:H*0.1};this.L=H*0.46;},
  enter(){this.ang=0.7;this.vel=0;this.drag=false;this.trail=[];this.popped=0;this.t=0;
    this.orbs=[];const n=7;for(let i=0;i<n;i++)this.orbs.push({x:rand(W*0.12,W*0.88),y:rand(H*0.3,H*0.78),r:16,alive:true,ph:rand(0,7),hue:rand(40,200)});
    hint('Drag the moon ball and let go to swing! 🌙',3800);},
  ballPos(){return {x:this.pivot.x+Math.sin(this.ang)*this.L,y:this.pivot.y+Math.cos(this.ang)*this.L};},
  update(dt){
    this.t+=dt;
    if(!this.drag){
      this.vel+=(-22/this.L*Math.sin(this.ang))*dt*60;
      this.vel*=0.995;this.ang+=this.vel*dt;
    }
    const b=this.ballPos();
    this.trail.push({x:b.x,y:b.y});if(this.trail.length>14)this.trail.shift();
    for(const o of this.orbs){o.ph+=dt*2;if(o.alive&&dist2(b.x,b.y,o.x,o.y)<(34+o.r)*(34+o.r)){o.alive=false;this.popped++;SFX.pop();
      o.burst=[];for(let i=0;i<10;i++){const a=rand(0,7);o.burst.push({x:o.x,y:o.y,vx:Math.cos(a)*rand(40,140),vy:Math.sin(a)*rand(40,140),life:1});}}
      if(o.burst)for(const p of o.burst){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.8;}
    }
    if(this.popped>=this.orbs.length&&!progress.moon){progress.moon=true;SFX.win();hint('All stars popped! 🌟 Tap ◀ to go back',5000);}
  },
  draw(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a2a72');g.addColorStop(0.6,'#241a52');g.addColorStop(1,'#4a2c7a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // bg stars
    for(let i=0;i<40;i++){const sx=(i*73.3)%W,sy=(i*131.7)%(H*0.9);ctx.globalAlpha=0.3+Math.abs(Math.sin(this.t+i))*0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,1.3,0,7);ctx.fill();}
    ctx.globalAlpha=1;
    // big soft moon
    const mx=W*0.8,my=H*0.16,mr=46;const mg=ctx.createRadialGradient(mx-12,my-12,4,mx,my,mr);mg.addColorStop(0,'#fffbe6');mg.addColorStop(1,'#cdbbf0');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
    // orbs (fireflies / star lights)
    for(const o of this.orbs){
      if(o.alive){const pulse=1+Math.sin(o.ph)*0.15;const col=`hsl(${o.hue},90%,70%)`;
        const gg=ctx.createRadialGradient(o.x,o.y,2,o.x,o.y,o.r*2.2*pulse);gg.addColorStop(0,col);gg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=gg;ctx.beginPath();ctx.arc(o.x,o.y,o.r*2.2*pulse,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y,o.r*0.5*pulse,0,7);ctx.fill();
      } else if(o.burst){ctx.fillStyle=`hsl(${o.hue},90%,75%)`;for(const p of o.burst){if(p.life>0){ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}}ctx.globalAlpha=1;}
    }
    // string + ball
    const b=this.ballPos();
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(this.pivot.x,this.pivot.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.pivot.x,this.pivot.y,5,0,7);ctx.fill();
    // trail
    for(let i=0;i<this.trail.length;i++){const tp=this.trail[i];ctx.globalAlpha=(i/this.trail.length)*0.35;ctx.fillStyle='#cfe0ff';ctx.beginPath();ctx.arc(tp.x,tp.y,30*(i/this.trail.length),0,7);ctx.fill();}
    ctx.globalAlpha=1;
    drawLuni(b.x,b.y,34,{rot:Math.sin(this.ang)*0.3});
    // counter
    ctx.fillStyle='#fff';ctx.font=`600 ${Math.min(W*0.05,20)}px 'Fredoka'`;ctx.textAlign='right';
    ctx.fillText('🌟 '+this.popped+' / '+this.orbs.length,W-20,H-Math.max(24,H*0.04));ctx.textAlign='left';
    this.back=drawBackBtn();
  },
  onDown(x,y){if(this.back&&dist2(x,y,this.back.x,this.back.y)<this.back.r*this.back.r){SFX.back();setScene('menu');return;}
    const b=this.ballPos();if(dist2(x,y,b.x,b.y)<60*60){this.drag=true;this.prevAng=this.ang;}},
  onMove(x,y){if(this.drag){this.prevAng=this.ang;this.ang=Math.atan2(x-this.pivot.x,y-this.pivot.y);}},
  onUp(){if(this.drag){this.vel=(this.ang-this.prevAng)*8;this.drag=false;}}
};

/* ======================================================================= */
current=Menu;resize();Menu.enter();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(current.update)current.update(dt);
  if(current.draw)current.draw();
  // fade transition
  if(fade.dir!==0){
    fade.a+=dt*3.5*fade.dir;
    if(fade.a>=1){fade.a=1;doSwitch(fade.to);fade.dir=-1;}
    if(fade.a<=0){fade.a=0;fade.dir=0;}
    ctx.fillStyle=`rgba(20,12,40,${fade.a})`;ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
