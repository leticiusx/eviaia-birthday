<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b2a4a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Super Evi World 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b2a4a;
    font-family:'Fredoka',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;}
  #game{display:block;width:100vw;height:100vh;}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);
    z-index:5;pointer-events:none;background:rgba(0,0,0,0.4);color:#fff;font-weight:600;
    padding:8px 18px;border-radius:999px;font-size:clamp(0.9rem,4vw,1.15rem);white-space:nowrap;
    opacity:0;transition:opacity .3s;backdrop-filter:blur(4px);}
  #hint.show{opacity:1;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint"></div>
<script>
(function(){
"use strict";
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const hintEl=document.getElementById('hint');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(current&&current.layout)current.layout();
}
window.addEventListener('resize',()=>resize());

// ---------- math ----------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- audio ----------
let actx=null,muted=false,noiseBuf=null;
function ensureAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();
  const n=actx.sampleRate*0.4;noiseBuf=actx.createBuffer(1,n,actx.sampleRate);const d=noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){}}
function tone(f,dur,type,vol,when){if(muted||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.07;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+(when||0);g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.15));
  o.start(t);o.stop(t+(dur||0.15));}catch(e){}}
function noise(dur,vol,freq){if(muted||!actx||!noiseBuf)return;try{const s=actx.createBufferSource();s.buffer=noiseBuf;
  const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;f.Q.value=0.8;const g=actx.createGain();g.gain.value=vol||0.05;
  s.connect(f);f.connect(g);g.connect(actx.destination);const t=actx.currentTime;g.gain.setValueAtTime(g.gain.value,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.start(t);s.stop(t+dur);}catch(e){}}
const SFX={
  tap:()=>{tone(660,0.09,'triangle',0.07);tone(990,0.08,'sine',0.04,0.02);},
  drip:()=>noise(0.12,0.045,900+Math.random()*400),
  bloom:()=>[523,659,784,1046].forEach((f,i)=>tone(f,0.18,'triangle',0.06,i*0.06)),
  page:()=>noise(0.18,0.05,500),
  pop:()=>{tone(880,0.07,'square',0.06);tone(1320,0.1,'sine',0.05,0.05);},
  paint:()=>noise(0.06,0.03,600+Math.random()*600),
  win:()=>[523,659,784,1046,1319].forEach((f,i)=>tone(f,0.2,'triangle',0.07,i*0.08)),
  back:()=>tone(440,0.08,'sine',0.05),
  hover:()=>{tone(740,0.05,'square',0.05);tone(1100,0.04,'square',0.03,0.03);},
  select:()=>{[660,990,1320].forEach((f,i)=>tone(f,0.09,'square',0.06,i*0.05));},
};

// ---------- pointer ----------
const P={x:0,y:0,down:false,downX:0,downY:0,moved:false};
function pt(e){const t=e.touches?e.touches[0]:e;return t?{x:t.clientX,y:t.clientY}:null;}
function onDown(e){const p=pt(e);if(!p)return;ensureAudio();P.x=p.x;P.y=p.y;P.down=true;P.downX=p.x;P.downY=p.y;P.moved=false;if(overlay)return;if(current.onDown)current.onDown(p.x,p.y);}
function onMove(e){const p=pt(e);if(!p)return;if(Math.abs(p.x-P.downX)>6||Math.abs(p.y-P.downY)>6)P.moved=true;P.x=p.x;P.y=p.y;if(overlay)return;if(current.onMove)current.onMove(p.x,p.y);}
function onUp(){const tap=!P.moved;P.down=false;
  if(overlay){const b=overlay.btn;if(b&&P.x>b.x&&P.x<b.x+b.w&&P.y>b.y&&P.y<b.y+b.h){overlay=null;SFX.tap();setScene('menu');}return;}
  if(current.onUp)current.onUp(P.x,P.y,tap);}
canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onUp(e);},{passive:false});

let hintTimer=null;
function hint(t,ms){hintEl.textContent=t;hintEl.classList.add('show');clearTimeout(hintTimer);if(ms)hintTimer=setTimeout(()=>hintEl.classList.remove('show'),ms);}
function hideHint(){hintEl.classList.remove('show');}

// ====================================================================
//  RICH RENDERING TOOLKIT  (depth / atmosphere / pseudo-3D)
// ====================================================================
function vGrad(y0,y1,stops){const g=ctx.createLinearGradient(0,y0,0,y1);for(const s of stops)g.addColorStop(s[0],s[1]);return g;}

// layered hazy mountain/jungle ridges fading into atmosphere
function ridges(horizonY,layers){
  for(const L of layers){
    ctx.fillStyle=L.color;ctx.beginPath();ctx.moveTo(0,H);
    const top=horizonY-L.h;
    for(let x=0;x<=W;x+=10){
      const y=top+Math.sin((x+L.off)/L.wl)*L.amp+Math.sin((x*1.7+L.off)/(L.wl*0.5))*L.amp*0.35;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  }
}

// soft volumetric god-rays from a light source
function godRays(cx,cy,tint){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){
    const a=(i/14)*TAU+0.2, len=Math.max(W,H)*1.2, wdt=0.06;
    ctx.fillStyle=tint||'rgba(255,244,200,0.045)';
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a-wdt)*len,cy+Math.sin(a-wdt)*len);
    ctx.lineTo(cx+Math.cos(a+wdt)*len,cy+Math.sin(a+wdt)*len);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

// Mode-7-ish perspective ground grid (Mario Kart depth)
function perspGround(horizonY,opt){
  ctx.fillStyle=vGrad(horizonY,H,opt.fill);ctx.fillRect(0,horizonY,W,H-horizonY);
  const vx=opt.vanishX!==undefined?opt.vanishX:W/2;
  ctx.save();ctx.beginPath();ctx.rect(0,horizonY,W,H-horizonY);ctx.clip();
  ctx.strokeStyle=opt.line;ctx.lineWidth=opt.lw||1.5;
  const cols=opt.cols||16, spread=opt.spread||2.2;
  for(let i=-cols;i<=cols;i++){
    ctx.beginPath();ctx.moveTo(vx,horizonY);ctx.lineTo(vx+i*(W*spread/cols),H);ctx.stroke();
  }
  const rows=opt.rows||12, scr=(opt.scroll||0)%1;
  for(let i=0;i<=rows;i++){
    const t=(i+scr)/rows, y=horizonY+(H-horizonY)*(t*t);
    if(y<=horizonY)continue;
    ctx.globalAlpha=clamp((y-horizonY)/((H-horizonY)*0.5),0,1);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function sunDisc(x,y,r,inner,outer){
  const g=ctx.createRadialGradient(x,y,2,x,y,r*1.7);g.addColorStop(0,inner);g.addColorStop(0.45,outer);g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.7,0,TAU);ctx.fill();
  ctx.fillStyle=inner;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
}
function cloud(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col||'#fff';ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.arc(30,-12,32,0,TAU);ctx.arc(64,0,26,0,TAU);ctx.arc(32,14,30,0,TAU);ctx.fill();ctx.restore();}
function softShadow(x,y,w,h,a){ctx.fillStyle='rgba(0,0,0,'+(a||0.16)+')';ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,TAU);ctx.fill();}

// ambient floating particle field (spores/dust/stars) — gives N64 atmosphere
function ParticleField(n,opt){
  this.opt=opt||{};const o=this.opt;
  this.ps=Array.from({length:n},()=>({x:rand(0,W),y:rand(0,H),r:rand(o.rMin||1,o.rMax||3),
    vx:rand(-(o.drift||8),(o.drift||8)),vy:rand(-(o.rise||14),-(o.rise||14)*0.2),ph:rand(0,TAU),sp:rand(1,3)}));
}
ParticleField.prototype.update=function(dt){for(const p of this.ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph+=p.sp*dt;
  if(p.y<-10){p.y=H+10;p.x=rand(0,W);}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;}};
ParticleField.prototype.draw=function(col){for(const p of this.ps){ctx.globalAlpha=0.25+Math.abs(Math.sin(p.ph))*0.5;
  ctx.fillStyle=col||'rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;};

// ---------- mascot ----------
function drawLuni(x,y,r,opts){opts=opts||{};
  ctx.save();ctx.translate(x,y);if(opts.rot)ctx.rotate(opts.rot);
  softShadow(0,r*0.98,r*0.8,r*0.22);
  const g=ctx.createRadialGradient(-r*0.32,-r*0.36,r*0.15,0,0,r);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.55,'#eef2ff');g.addColorStop(1,'#b9c6ef');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.09);ctx.strokeStyle='#46507e';ctx.stroke();
  // rim light
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=r*0.06;ctx.beginPath();ctx.arc(0,0,r*0.93,TAU*0.6,TAU*0.95);ctx.stroke();
  ctx.fillStyle='rgba(150,162,205,0.5)';
  ctx.beginPath();ctx.arc(-r*0.34,r*0.28,r*0.16,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.36,-r*0.12,r*0.1,0,TAU);ctx.fill();
  ctx.fillStyle='#3a3550';
  ctx.beginPath();ctx.arc(-r*0.26,-r*0.06,r*0.1,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(r*0.26,-r*0.06,r*0.1,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.29,-r*0.1,r*0.035,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(r*0.23,-r*0.1,r*0.035,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,140,170,0.5)';ctx.beginPath();ctx.arc(-r*0.42,r*0.16,r*0.1,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(r*0.42,r*0.16,r*0.1,0,TAU);ctx.fill();
  ctx.strokeStyle='#3a3550';ctx.lineWidth=Math.max(2,r*0.06);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,r*0.12,r*0.26,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.restore();
}

// ---------- Evi (rainbow-haired hero, low-poly cartoon) ----------
const HAIR=['#ff4d6d','#ff9e2c','#ffd23f','#5ed24f','#54b8ff','#9b5bff'];
function drawEvi(x,y,S,opt){opt=opt||{};const t=opt.t||0;
  ctx.save();ctx.translate(x,y+(opt.bob?Math.sin(t*4)*S*0.02:0));
  const hr=S*0.17;
  softShadow(0,4,S*0.2,S*0.045,0.2);
  const sw=opt.walk?Math.sin(t*7)*S*0.06:0;
  function leg(dx,ph){ctx.save();ctx.translate(dx,-S*0.2);ctx.rotate(ph);ctx.fillStyle='#f3c9a2';rr(-S*0.035,0,S*0.07,S*0.2,S*0.035);ctx.fill();
    ctx.fillStyle='#ff4d6d';rr(-S*0.05,S*0.16,S*0.1,S*0.06,4);ctx.fill();ctx.restore();}
  leg(-S*0.08, opt.walk?sw*0.06:0); leg(S*0.08, opt.walk?-sw*0.06:0);
  // dress
  const dTop=-S*0.5,dBot=-S*0.16;
  ctx.fillStyle='#f3c9a2';ctx.lineWidth=S*0.055;ctx.strokeStyle='#f3c9a2';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-S*0.07,dTop+S*0.05);ctx.lineTo(-S*0.19,dTop+S*0.16+(opt.armL||0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(S*0.07,dTop+S*0.05);ctx.lineTo(S*0.19+(opt.armR||0)*0,dTop+S*0.16+(opt.armR||0));ctx.stroke();
  const dg=ctx.createLinearGradient(0,dTop,0,dBot);dg.addColorStop(0,'#5ad7ec');dg.addColorStop(1,'#2b9fd4');
  ctx.fillStyle=dg;ctx.beginPath();ctx.moveTo(-S*0.1,dTop);ctx.lineTo(S*0.1,dTop);ctx.lineTo(S*0.2,dBot);ctx.lineTo(-S*0.2,dBot);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.moveTo(-S*0.06,dTop);ctx.lineTo(0,dTop);ctx.lineTo(-S*0.04,dBot);ctx.lineTo(-S*0.14,dBot);ctx.closePath();ctx.fill();
  // head
  const hy=dTop-hr*0.62;
  for(let i=0;i<HAIR.length;i++){ctx.fillStyle=HAIR[i];const a=-1+(i/(HAIR.length-1))*2;
    ctx.beginPath();ctx.ellipse(a*hr*0.95,hy+hr*0.7,hr*0.36,hr*1.0,a*0.32,0,TAU);ctx.fill();}
  ctx.fillStyle='#ffe2c4';ctx.beginPath();ctx.arc(0,hy,hr,0,TAU);ctx.fill();
  for(let i=0;i<HAIR.length;i++){ctx.fillStyle=HAIR[i];const a=-1+(i/(HAIR.length-1))*2;
    ctx.beginPath();ctx.arc(a*hr*0.72,hy-hr*0.6,hr*0.36,0,TAU);ctx.fill();}
  ctx.fillStyle='#3a3550';ctx.beginPath();ctx.arc(-hr*0.36,hy+hr*0.06,hr*0.15,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(hr*0.36,hy+hr*0.06,hr*0.15,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-hr*0.31,hy,hr*0.05,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(hr*0.41,hy,hr*0.05,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,140,170,0.6)';ctx.beginPath();ctx.arc(-hr*0.52,hy+hr*0.38,hr*0.13,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(hr*0.52,hy+hr*0.38,hr*0.13,0,TAU);ctx.fill();
  ctx.strokeStyle='#3a3550';ctx.lineWidth=hr*0.1;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,hy+hr*0.22,hr*0.3,0.12*Math.PI,0.88*Math.PI);ctx.stroke();
  ctx.restore();
}

// ---------- glowing mushroom on a floating island (Bloom Valley scenery) ----------
function drawMushroom(x,y,s,hue){ctx.save();ctx.translate(x,y);
  ctx.save();ctx.globalCompositeOperation='lighter';const gg=ctx.createRadialGradient(0,-s*0.6,2,0,-s*0.6,s*2);gg.addColorStop(0,`hsla(${hue},90%,70%,0.5)`);gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,-s*0.6,s*2,0,TAU);ctx.fill();ctx.restore();
  ctx.fillStyle='#f3ead6';rr(-s*0.22,-s*0.6,s*0.44,s*0.7,s*0.18);ctx.fill();
  const cg=ctx.createLinearGradient(0,-s*1.2,0,-s*0.5);cg.addColorStop(0,`hsl(${hue},85%,68%)`);cg.addColorStop(1,`hsl(${hue},80%,48%)`);
  ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(0,-s*0.6,s*0.7,s*0.5,0,Math.PI,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(rand(-s*0.4,s*0.4),-s*0.7+rand(-s*0.1,s*0.05),s*0.07,0,TAU);ctx.fill();}
  ctx.restore();}
function floatIsland(x,y,w,t){ctx.save();ctx.translate(x,y+Math.sin(t)*4);
  ctx.fillStyle='#5c3517';ctx.beginPath();ctx.moveTo(-w/2,0);ctx.quadraticCurveTo(0,w*0.55,w/2,0);ctx.quadraticCurveTo(w*0.2,-w*0.1,0,-w*0.08);ctx.quadraticCurveTo(-w*0.2,-w*0.1,-w/2,0);ctx.fill();
  ctx.fillStyle='#4caf32';ctx.beginPath();ctx.ellipse(0,-w*0.05,w/2,w*0.14,0,0,TAU);ctx.fill();
  ctx.fillStyle='#3d9128';ctx.beginPath();ctx.ellipse(0,-w*0.05,w*0.42,w*0.1,0,0,TAU);ctx.fill();ctx.restore();}

// ---------- drawn flower (with optional glow for the Avatar garden) ----------
function drawFlower(baseX,baseY,g,type,sway,glow){
  const grow=easeOut(clamp(g,0,1));
  if(grow<=0.001){ctx.fillStyle='#6b3f1d';ctx.beginPath();ctx.ellipse(baseX,baseY,16,7,0,0,TAU);ctx.fill();return;}
  const h=type.height*grow, lean=Math.sin(sway||0)*6*grow, topX=baseX+lean, topY=baseY-h;
  const sg=ctx.createLinearGradient(baseX,baseY,topX,topY);sg.addColorStop(0,'#277a22');sg.addColorStop(1,'#62cc52');
  ctx.strokeStyle=sg;ctx.lineWidth=Math.max(3,7*grow);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(baseX,baseY);ctx.quadraticCurveTo(baseX+lean*0.5-6,baseY-h*0.5,topX,topY);ctx.stroke();
  function leaf(t,dir){const ls=clamp((grow-t)/0.22,0,1);if(ls<=0)return;const ly=baseY-h*t,lx=baseX+lean*t;
    ctx.save();ctx.translate(lx,ly);ctx.rotate(dir*0.7);ctx.scale(ls,ls);
    const lg=ctx.createLinearGradient(0,0,dir*34,0);lg.addColorStop(0,'#3da82f');lg.addColorStop(1,'#7ee06a');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(dir*20,-14,dir*40,0);ctx.quadraticCurveTo(dir*20,10,0,0);ctx.fill();ctx.restore();}
  leaf(0.34,-1);leaf(0.52,1);
  const bloom=clamp((grow-0.6)/0.4,0,1);
  if(bloom>0){const b=easeOut(bloom);ctx.save();ctx.translate(topX,topY);
    if(glow){ctx.save();ctx.globalCompositeOperation='lighter';const gg=ctx.createRadialGradient(0,0,2,0,0,type.petalLen*1.6*b);gg.addColorStop(0,type.glow||'rgba(255,230,120,0.5)');gg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,type.petalLen*1.6*b,0,TAU);ctx.fill();ctx.restore();}
    if(type.kind!=='tulip'){const n=type.petals,pl=type.petalLen*b,pw=type.petalW*b;
      for(let i=0;i<n;i++){ctx.save();ctx.rotate((i/n)*TAU+grow*0.4);const pg=ctx.createLinearGradient(0,0,0,-pl);pg.addColorStop(0,type.c1);pg.addColorStop(1,type.c2);
        ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(0,-pl*0.55,pw,pl*0.55,0,0,TAU);ctx.fill();ctx.restore();}
      const cr=type.center*b,cg=ctx.createRadialGradient(-cr*0.3,-cr*0.3,1,0,0,cr);cg.addColorStop(0,type.cc1);cg.addColorStop(1,type.cc2);
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,cr,0,TAU);ctx.fill();

    {key:'moon',  title:'MOONLIT COSMOS',top:'#7a86ff',side:'#2e3380',neon:'#8ef6ff'},

  layout(){

  update(dt){this.t+=dt;this.grid+=dt*0.55;this.pf.update(dt);

    if(allDone()){if(this.confetti.length<150&&Math.random()<0.5){const cols=['#ff5b7a','#ffd23f','#54b8ff','#5ed24f','#ff7ab8'];
      this.confetti.push({x:rand(0,W),y:-10,vx:rand(-30,30),vy:rand(60,150),rot:rand(0,7),vr:rand(-5,5),c:cols[(Math.random()*cols.length)|0],w:rand(6,12)});}
      for(const p of this.confetti){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}this.confetti=this.confetti.filter(p=>p.y<H+20);}},
  draw(){

  modeSeven(horizon){

    ctx.strokeStyle=foc?c.neon:'rgba(255,255,255,0.8)';ctx.lineWidth=2.5;rr(c.x+2.5,c.y+2.5,c.w-5,c.h-5,r-2);ctx.stroke();

  },
  preview(key,x,y,w,h){

const Garden={
  plants:[],can:{x:0,y:0,pouring:false},drops:[],butterflies:[],sprites:[],islands:[],t:0,doneT:0,back:null,pf:null,
  layout(){const n=3,gy=H*0.8,m=W*0.18,span=W-2*m;
    this.plants=this.plants.length===n?this.plants.map((p,i)=>({...p,x:m+span*(i/(n-1)),baseY:gy})):
      Array.from({length:n},(_,i)=>({x:m+span*(i/(n-1)),baseY:gy,g:0,type:FLOWERS[i],sway:rand(0,7),bloomed:false}));},
  enter(){this.drops=[];this.butterflies=[];this.sprites=[];this.t=0;this.doneT=0;this.can.x=W/2;this.can.y=H*0.4;this.can.pouring=false;
    this.islands=[{x:W*0.2,y:H*0.3,w:Math.min(W*0.22,110),hue:300,ph:0},{x:W*0.74,y:H*0.24,w:Math.min(W*0.26,130),hue:180,ph:2},{x:W*0.5,y:H*0.42,w:Math.min(W*0.18,90),hue:50,ph:4}];
    this.pf=new ParticleField(30,{rMax:2.6,drift:7,rise:12});hint('Hold over a plant to water it! 💧',3500);},
  emitSprites(x,y){for(let i=0;i<8;i++)this.sprites.push({x,y,vx:rand(-40,40),vy:rand(-120,-40),life:1,hue:rand(40,200)});},
  spout(){return {x:this.can.x-34,y:this.can.y+6};},
  pourTarget(){const sx=this.spout().x;let best=null,bd=1e9;for(const p of this.plants){const d=Math.abs(p.x-sx);if(d<70&&d<bd&&this.spout().y<p.baseY-10){bd=d;best=p;}}return best;},
  update(dt){this.t+=dt;this.pf.update(dt);for(const p of this.plants)p.sway+=dt*1.5;
    if(this.can.pouring){const tgt=this.pourTarget();
      if(Math.random()<0.6){const s=this.spout();this.drops.push({x:s.x+rand(-4,4),y:s.y,vy:rand(120,180),vx:rand(-10,10)});}
      if(Math.random()<0.25)SFX.drip();
      if(tgt&&!tgt.bloomed){tgt.g=clamp(tgt.g+dt*0.32,0,1);if(tgt.g>=1){tgt.bloomed=true;SFX.bloom();addScore(8000);
        this.emitSprites(tgt.x,tgt.baseY-tgt.type.height);
        for(let i=0;i<3;i++)this.butterflies.push({x:tgt.x+rand(-20,20),y:tgt.baseY-tgt.type.height,t:rand(0,7)});}}}
    for(const d of this.drops){d.y+=d.vy*dt;d.x+=d.vx*dt;d.vy+=400*dt;}this.drops=this.drops.filter(d=>d.y<H*0.84);

const Arts={
  G:9,h:null,tw:0,voxH:0,ox:0,oy:0,count:0,need:36,t:0,back:null,clearBtn:null,done:false,sparks:[],last:null,
  layout(){this.tw=Math.min(W*0.92,380)/this.G;this.voxH=this.tw*0.56;this.ox=W/2;this.oy=H*0.32;
    if(!this.h)this.h=Array.from({length:this.G},()=>new Array(this.G).fill(0));},
  enter(){this.t=0;this.done=false;this.sparks=[];this.last=null;if(!this.h)this.layout();
    hint('Tap to stack rainbow blocks! 🧊',3500);},
  cellAt(mx,my){const w2=this.tw/2,h2=this.tw/4;const dx=(mx-this.ox)/w2,dy=(my-this.oy)/h2;
    const i=Math.round((dx+dy)/2),j=Math.round((dy-dx)/2);
    if(i<0||j<0||i>=this.G||j>=this.G)return null;return {i,j};},
  place(mx,my){const c=this.cellAt(mx,my);if(!c)return;const k=this.h[c.i][c.j];if(k>=6)return;
    this.h[c.i][c.j]++;this.count++;addScore(500);SFX.pop();
    const sx=this.ox+(c.i-c.j)*this.tw/2,sy=this.oy+(c.i+c.j)*this.tw/4-(k+1)*this.voxH;
    for(let n=0;n<5;n++)this.sparks.push({x:sx,y:sy,vx:rand(-60,60),vy:rand(-120,-20),life:0.7,c:`hsl(${((c.i+c.j)*30+k*45)%360},90%,65%)`});
    if(!this.done&&this.count>=this.need){this.done=true;progress.arts=true;showPop('arts');}},
  update(dt){this.t+=dt;for(const s of this.sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;s.life-=dt*1.6;}this.sparks=this.sparks.filter(s=>s.life>0);},
  cube(cx,cy,hue,top){const w2=this.tw/2,h2=this.tw/4,vh=this.voxH;
    ctx.fillStyle=`hsl(${hue},70%,40%)`;ctx.beginPath();ctx.moveTo(cx-w2,cy);ctx.lineTo(cx,cy+h2);ctx.lineTo(cx,cy+h2+vh);ctx.lineTo(cx-w2,cy+vh);ctx.closePath();ctx.fill();
    ctx.fillStyle=`hsl(${hue},75%,30%)`;ctx.beginPath();ctx.moveTo(cx+w2,cy);ctx.lineTo(cx,cy+h2);ctx.lineTo(cx,cy+h2+vh);ctx.lineTo(cx+w2,cy+vh);ctx.closePath();ctx.fill();
    ctx.fillStyle=`hsl(${hue},88%,${top?66:60}%)`;ctx.beginPath();ctx.moveTo(cx,cy-h2);ctx.lineTo(cx+w2,cy);ctx.lineTo(cx,cy+h2);ctx.lineTo(cx-w2,cy);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=1;ctx.stroke();},
  draw(){
    ctx.fillStyle=vGrad(0,H,[[0,'#2a1140'],[0.5,'#5a1d6e'],[1,'#23103f']]);ctx.fillRect(0,0,W,H);
    for(let i=0;i<30;i++){ctx.globalAlpha=0.25+Math.abs(Math.sin(this.t*1.5+i))*0.4;ctx.fillStyle=`hsl(${(i*30)%360},80%,70%)`;ctx.beginPath();ctx.arc((i*71)%W,(i*97+this.t*10)%H,2,0,TAU);ctx.fill();}ctx.globalAlpha=1;
    const w2=this.tw/2,h2=this.tw/4;
    for(let i=0;i<this.G;i++)for(let j=0;j<this.G;j++){const cx=this.ox+(i-j)*w2,cy=this.oy+(i+j)*h2;
      ctx.fillStyle=(i+j)%2?'rgba(255,255,255,0.06)':'rgba(255,255,255,0.12)';ctx.beginPath();ctx.moveTo(cx,cy-h2);ctx.lineTo(cx+w2,cy);ctx.lineTo(cx,cy+h2);ctx.lineTo(cx-w2,cy);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=1;ctx.stroke();}
    for(let s=0;s<=2*(this.G-1);s++)for(let i=0;i<this.G;i++){const j=s-i;if(j<0||j>=this.G)continue;
      const stack=this.h[i][j];for(let k=0;k<stack;k++){const cx=this.ox+(i-j)*w2,cy=this.oy+(i+j)*h2-k*this.voxH;this.cube(cx,cy,((i+j)*30+k*45)%360,k===stack-1);}}

    const mg=ctx.createLinearGradient(mx,0,mx+mw,0);mg.addColorStop(0,'#ff5b7a');mg.addColorStop(0.5,'#ffd23f');mg.addColorStop(1,'#54b8ff');

    ctx.fillStyle='#fff';ctx.font=`${Math.min(W*0.04,13)}px 'Press Start 2P',monospace`;ctx.textAlign='center';ctx.fillText(this.done?'AWESOME!':'KEEP SCULPTING!',W/2,my-12);ctx.textAlign='left';
    this.clearBtn={x:W-44,y:H-46,r:26};ctx.fillStyle='#fff';ctx.strokeStyle='#9b5bff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.clearBtn.x,this.clearBtn.y,26,0,TAU);ctx.fill();ctx.stroke();
    ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🗑️',this.clearBtn.x,this.clearBtn.y);ctx.textBaseline='alphabetic';ctx.textAlign='left';
    this.back=drawBackBtn();},
  onDown(x,y){if(this.back&&dist2(x,y,this.back.x,this.back.y)<this.back.r*this.back.r){SFX.back();setScene('menu');return;}
    if(this.clearBtn&&dist2(x,y,this.clearBtn.x,this.clearBtn.y)<this.clearBtn.r*this.clearBtn.r){this.h=Array.from({length:this.G},()=>new Array(this.G).fill(0));this.count=0;this.done=false;SFX.back();return;}
    this.last=null;this.place(x,y);this.last={x,y};},
  onMove(x,y){if(P.down&&this.last&&dist2(x,y,this.last.x,this.last.y)>this.tw*this.tw*0.2){this.place(x,y);this.last={x,y};}},
  onUp(){this.last=null;}
};

      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-r*1.4);ctx.lineTo(x+Math.sin(this.t)*r*0.4,y);ctx.stroke();drawLuni(x+Math.sin(this.t)*r*0.4,y,r*0.55);}
  },
  balloon(x,y,c,txt){ctx.strokeStyle='#aaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x,y+44);ctx.stroke();
    ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,15,19,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font=`16px 'Luckiest Guy'`;ctx.textAlign='center';ctx.fillText(txt,x,y+5);},
  sparkle(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(this.t);ctx.fillStyle='#ffd23f';for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(2,-6);ctx.lineTo(0,-12);ctx.lineTo(-2,-6);ctx.fill();}ctx.restore();},
  arrows(x,y,w,h){const ay=H-Math.max(46,H*0.07);if(this.page>0)this.arrowBtn(x+30,ay,-1);if(this.page<this.pages.length-1)this.arrowBtn(x+w-30,ay,1);},
  arrowBtn(x,y,d){ctx.fillStyle='#c0581f';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,24,0,TAU);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-d*5,y-8);ctx.lineTo(x+d*7,y);ctx.lineTo(x-d*5,y+8);ctx.stroke();this['_arr'+(d<0?'L':'R')]={x,y,r:30};},
  onUp(x,y,tap){if(this.back&&dist2(x,y,this.back.x,this.back.y)<this.back.r*this.back.r){SFX.back();setScene('menu');return;}
    if(this._arrL&&dist2(x,y,this._arrL.x,this._arrL.y)<this._arrL.r*this._arrL.r){this.next(-1);return;}
    if(this._arrR&&dist2(x,y,this._arrR.x,this._arrR.y)<this._arrR.r*this._arrR.r){this.next(1);return;}
    if(tap){if(x>W/2)this.next(1);else this.next(-1);return;}
    const dx=x-P.downX;if(dx<-40)this.next(1);else if(dx>40)this.next(-1);}
};

/* =====================================================================
   MOON — "Moonlit Cosmos": pendulum physics, pop the star-lights
   ===================================================================== */
const Moon={
  pivot:{x:0,y:0},L:0,ang:0.7,vel:0,drag:false,prevAng:0,trail:[],orbs:[],t:0,back:null,popped:0,stars:[],
  layout(){this.pivot={x:W/2,y:H*0.1};this.L=H*0.46;
    this.stars=Array.from({length:70},()=>({x:rand(0,W),y:rand(0,H),r:rand(0.6,2),ph:rand(0,TAU),d:rand(0.3,1)}));},
  enter(){this.ang=0.7;this.vel=0;this.drag=false;this.trail=[];this.popped=0;this.t=0;this.rocket={x:-60,y:H*0.7,sp:rand(70,110)};
    this.orbs=Array.from({length:8},()=>({x:rand(W*0.12,W*0.88),y:rand(H*0.3,H*0.8),r:16,alive:true,ph:rand(0,TAU),hue:rand(40,260),burst:null}));
    hint('Drag the moon ball and let go to swing! 🌙',3800);},
  ballPos(){return {x:this.pivot.x+Math.sin(this.ang)*this.L,y:this.pivot.y+Math.cos(this.ang)*this.L};},
  update(dt){this.t+=dt;for(const s of this.stars)s.ph+=dt*s.d*2;
    const rk=this.rocket;rk.x+=rk.sp*dt;rk.y-=rk.sp*0.35*dt;if(rk.x>W+80||rk.y<-80){rk.x=-60;rk.y=H*0.55+rand(0,H*0.3);rk.sp=rand(70,110);}
    if(!this.drag){this.vel+=(-22/this.L*Math.sin(this.ang))*dt*60;this.vel*=0.995;this.ang+=this.vel*dt;}
    const b=this.ballPos();this.trail.push({x:b.x,y:b.y});if(this.trail.length>14)this.trail.shift();
    for(const o of this.orbs){o.ph+=dt*2;if(o.alive&&dist2(b.x,b.y,o.x,o.y)<(34+o.r)*(34+o.r)){o.alive=false;this.popped++;SFX.pop();addScore(4000);
      o.burst=Array.from({length:12},()=>{const a=rand(0,TAU);return {x:o.x,y:o.y,vx:Math.cos(a)*rand(40,150),vy:Math.sin(a)*rand(40,150),life:1};});}
      if(o.burst)for(const p of o.burst){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.8;}}
    if(this.popped>=this.orbs.length&&!progress.moon){progress.moon=true;showPop('moon');}},
  drawRocket(){const rk=this.rocket;ctx.save();ctx.translate(rk.x,rk.y);ctx.rotate(-0.34);
    ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<6;i++){ctx.fillStyle=`rgba(255,${160-i*18},60,${0.5-i*0.07})`;ctx.beginPath();ctx.ellipse(-22-i*7,0,7,5-i*0.5,0,0,TAU);ctx.fill();}ctx.restore();
    ctx.fillStyle='#e9eef7';ctx.beginPath();ctx.moveTo(20,0);ctx.quadraticCurveTo(2,-11,-16,-9);ctx.lineTo(-16,9);ctx.quadraticCurveTo(2,11,20,0);ctx.fill();
    ctx.fillStyle='#ff5b6e';ctx.beginPath();ctx.moveTo(-16,-9);ctx.lineTo(-26,-17);ctx.lineTo(-16,-2);ctx.fill();ctx.beginPath();ctx.moveTo(-16,9);ctx.lineTo(-26,17);ctx.lineTo(-16,2);ctx.fill();
    ctx.fillStyle='#7fd3ff';ctx.beginPath();ctx.arc(4,0,5,0,TAU);ctx.fill();ctx.restore();},
  draw(){
    // nebula cosmos
    ctx.fillStyle=vGrad(0,H,[[0,'#16103a'],[0.5,'#2a1a55'],[1,'#46204e']]);ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const neb=(cx,cy,r,col)=>{const g=ctx.createRadialGradient(cx,cy,2,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();};
    neb(W*0.25,H*0.35,W*0.5,'rgba(120,60,180,0.35)');neb(W*0.8,H*0.6,W*0.45,'rgba(60,110,200,0.3)');neb(W*0.6,H*0.2,W*0.4,'rgba(220,80,160,0.22)');
    ctx.restore();
    for(const s of this.stars){ctx.globalAlpha=0.25+Math.abs(Math.sin(s.ph))*0.65*s.d;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;
    // ringed planet (depth)
    const px=W*0.78,py=H*0.2,pr=38;ctx.save();ctx.fillStyle='#e6b96a';const pg=ctx.createRadialGradient(px-12,py-12,4,px,py,pr);pg.addColorStop(0,'#ffe1a0');pg.addColorStop(1,'#c98a3a');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,pr,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,230,180,0.7)';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(px,py,pr*1.7,pr*0.5,-0.4,0,TAU);ctx.stroke();ctx.restore();
    this.drawRocket();
    // orbs
    for(const o of this.orbs){if(o.alive){const pulse=1+Math.sin(o.ph)*0.15,col=`hsl(${o.hue},90%,70%)`;
      const gg=ctx.createRadialGradient(o.x,o.y,2,o.x,o.y,o.r*2.4*pulse);gg.addColorStop(0,col);gg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(o.x,o.y,o.r*2.4*pulse,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y,o.r*0.5*pulse,0,TAU);ctx.fill();}
      else if(o.burst){ctx.fillStyle=`hsl(${o.hue},90%,75%)`;for(const p of o.burst)if(p.life>0){ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,3,0,TAU);ctx.fill();}ctx.globalAlpha=1;}}
    const b=this.ballPos();
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(this.pivot.x,this.pivot.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.pivot.x,this.pivot.y,5,0,TAU);ctx.fill();
    for(let i=0;i<this.trail.length;i++){const tp=this.trail[i];ctx.globalAlpha=(i/this.trail.length)*0.35;ctx.fillStyle='#cfe0ff';ctx.beginPath();ctx.arc(tp.x,tp.y,30*(i/this.trail.length),0,TAU);ctx.fill();}ctx.globalAlpha=1;
    drawLuni(b.x,b.y,34,{rot:Math.sin(this.ang)*0.3});
    ctx.fillStyle='#fff';ctx.font=`600 ${Math.min(W*0.05,20)}px 'Fredoka'`;ctx.textAlign='right';ctx.fillText('🌟 '+this.popped+' / '+this.orbs.length,W-20,H-24);ctx.textAlign='left';
    this.back=drawBackBtn();},
  onDown(x,y){if(this.back&&dist2(x,y,this.back.x,this.back.y)<this.back.r*this.back.r){SFX.back();setScene('menu');return;}
    const b=this.ballPos();if(dist2(x,y,b.x,b.y)<60*60){this.drag=true;this.prevAng=this.ang;}},
  onMove(x,y){if(this.drag){this.prevAng=this.ang;this.ang=Math.atan2(x-this.pivot.x,y-this.pivot.y);}},
  onUp(){if(this.drag){this.vel=(this.ang-this.prevAng)*8;this.drag=false;}}
};

/* ===================================================================== */
current=Menu;resize();Menu.enter();
let last=performance.now();
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(current.update)current.update(dt);if(current.draw)current.draw();
  if(overlay)drawPop(dt);
  if(fade.dir!==0){fade.a+=dt*3.5*fade.dir;if(fade.a>=1){fade.a=1;doSwitch(fade.to);fade.dir=-1;}if(fade.a<=0){fade.a=0;fade.dir=0;}
    ctx.fillStyle=`rgba(16,10,34,${fade.a})`;ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
