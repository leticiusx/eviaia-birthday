<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Eviaia</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    html, body {
  margin: 0;
  padding: 0;
  font-family: 'Luckiest Guy', cursive;
  background: url('https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif') repeat;
  background-size: 150px;
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}

    .overlay-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, rgba(255, 192, 203, 0.7), rgba(255, 255, 255, 0.3));
      z-index: 0;
      pointer-events: none;
    }

    .click-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, #7b2cbf, #f3c4fb);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 5vw;
  padding: 2rem;
  z-index: 999;
  cursor: pointer;
  box-sizing: border-box;
  line-height: 1.3;
}

    .hidden {
      display: none;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      color: #fffc00;
      text-shadow: 3px 3px 8px #ff00ff;
      margin: 1.5rem 1rem 0;
      line-height: 1.4;
    }

    .cake-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    #cake-animation {
      width: 300px;
      height: 300px;
    }

    .mario {
      width: 100px;
    }

  .play-btn {
  display: inline-block;
  margin: 1.4rem auto 0;
  padding: 0.7em 1.4em;
  font-family: 'Luckiest Guy', cursive;
  font-size: 1.5rem;
  color: #fff;
  text-decoration: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff5ecb, #7b2cbf);
  box-shadow: 0 6px 0 #4a1772, 0 10px 24px rgba(0,0,0,0.4);
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  letter-spacing: 1px;
  transition: transform .08s, box-shadow .08s;
  animation: wiggle 2.5s ease-in-out infinite;
}
  .play-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #4a1772; }
  @keyframes wiggle { 0%,100%{transform:rotate(-2deg) scale(1);} 50%{transform:rotate(2deg) scale(1.04);} }

  .message {
  font-size: 1.4rem;
  color: #fffc00; /* bright yellow */
  margin: 1rem 1rem 0;
  text-shadow: 2px 2px 5px #5a3e85; /* deep purple shadow */
  line-height: 1.6;
}


    @media (min-width: 600px) {
      h1 {
        font-size: 3.2rem;
      }
      #cake-animation {
        width: 400px;
        height: 400px;
      }
      .mario {
        width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay-bg"></div>
  <div class="click-overlay" onclick="reveal()">✨ Click to reveal your surprise! ✨</div>

  <div class="content hidden" id="mainContent">
    <audio autoplay loop>
      <source src="https://cdn.pixabay.com/download/audio/2022/03/02/audio_476abffc30.mp3?filename=birthday-6437.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <h1>Happy Birthday Eviaia!<br/>Congrats on another amazing year! 🎉</h1>

    <div class="cake-row">
      <img src="mario-2.png" class="mario" alt="Mario Left" />
      <div id="cake-animation"></div>
      <img src="mario-1.png" class="mario" alt="Mario Right" />
    </div>

    <a href="game.html" class="play-btn">🌙 Play Evi's Moon Ball Game! 🎮</a>

    <div class="message">🔮 Come back later... some more birthday magic may be hiding!</div>
  </div>

  <script>
    function reveal() {
      document.querySelector('.click-overlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.9.6/lottie.min.js"></script>
  <script>
    lottie.loadAnimation({
      container: document.getElementById("cake-animation"),
      renderer: "svg",
      loop: true,
      autoplay: true,
      path: "cake.json"
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
  <script>
    setInterval(() => {
      confetti({
        particleCount: 70,
        spread: 90,
        origin: { y: 0.6 }
      });
    }, 1500);
  </script>
</body>
</html>
